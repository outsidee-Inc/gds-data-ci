name: Test and Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-build]

concurrency:
  group: test-build-${{ github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: true

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TRIGGER_SHA: ${{ github.event.client_payload.sha }}
  TRIGGER_TAG: ${{ github.event.client_payload.tag }}
  # tag dispatch → release build; manual dispatch → debug build
  IS_TAG: ${{ github.event.client_payload.tag != '' }}

permissions:
  contents: read

jobs:
  Test-Build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same `prod` environment as the excel pipeline: the DEV_*/PROD_* credentials
    # are environment-scoped, so this job must declare the environment to read
    # them (see push-excel-process.yml).
    environment: prod

    env:
      DEV_MAIN_API_URL: ${{ secrets.DEV_MAIN_API_URL }}
      DEV_ACCESS_TOKEN_URL: ${{ secrets.DEV_ACCESS_TOKEN_URL }}
      DEV_ACCESS_SECRET_ID: ${{ secrets.DEV_ACCESS_SECRET_ID }}
      DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
      PROD_MAIN_API_URL: ${{ secrets.PROD_MAIN_API_URL }}
      PROD_ACCESS_TOKEN_URL: ${{ secrets.PROD_ACCESS_TOKEN_URL }}
      PROD_ACCESS_SECRET_ID: ${{ secrets.PROD_ACCESS_SECRET_ID }}
      PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
      RUST_LOG: info
      GDS_DATA_ROOT: ${{ github.workspace }}/src

    steps:
      - name: Mint CI bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.OUTSIDEE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OUTSIDEE_BOT_PRIVATE_KEY }}
          owner: outsidee-Inc
          repositories: gds-data

      - name: Set commit status (pending)
        if: env.TRIGGER_SHA != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$TRIGGER_SHA" \
            -f state="pending" -f context="ci/test-build" \
            -f description="Test and build is running" -f target_url="$RUN_URL"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: outsidee-Inc/gds-data
          token: ${{ steps.bot-token.outputs.token }}
          path: src
          # This job never pushes; keep the App token out of src/.git/config.
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.ref }}
          # tag builds need full history for git-cliff changelog
          fetch-depth: ${{ env.IS_TAG == 'true' && '0' || '1' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master branch pin)

      - name: Run sccache-cache (non-release only)
        if: env.IS_TAG != 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Set build env vars (non-release only)
        if: env.IS_TAG != 'true'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "DUCKDB_BUILD_CACHE=1" >> $GITHUB_ENV
          echo "DUCKDB_BUILD_THREADS=$(nproc)" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=$(nproc)" >> $GITHUB_ENV

      - name: Build binary (debug)
        if: env.IS_TAG != 'true'
        run: cargo build --verbose
        working-directory: src
        env:
          RUST_BACKTRACE: 1

      - name: Build binary (release)
        if: env.IS_TAG == 'true'
        run: cargo build --verbose --release
        working-directory: src
        env:
          RUST_BACKTRACE: 1

      - name: Test
        run: cargo test --verbose
        working-directory: src
        env:
          RUST_BACKTRACE: 1

      - name: Verify environment info (debug)
        if: env.IS_TAG != 'true'
        run: ./target/debug/gds-data info
        working-directory: src

      - name: Verify environment info (release)
        if: env.IS_TAG == 'true'
        run: ./target/release/gds-data info
        working-directory: src

      # ---------- release flow (tags only) ----------

      - name: Install git-cliff
        if: env.IS_TAG == 'true'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: git-cliff

      - name: Check if prerelease
        id: check-prerelease
        if: env.IS_TAG == 'true'
        run: |
          if [[ "$TRIGGER_TAG" =~ -alpha|-beta|-rc ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        if: env.IS_TAG == 'true' && steps.check-prerelease.outputs.prerelease == 'false'
        run: |
          git-cliff --latest --strip header --exclude-path "data/**" --exclude-path "bin/**" -o CHANGELOG_LATEST.md
        working-directory: src

      - name: Rename binary
        if: env.IS_TAG == 'true'
        run: mv src/target/release/gds-data gds-data-linux-amd64

      - name: Create GitHub Release (stable)
        if: env.IS_TAG == 'true' && steps.check-prerelease.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TRIGGER_TAG" gds-data-linux-amd64 \
            --repo outsidee-Inc/gds-data \
            --title "$TRIGGER_TAG" \
            --notes-file src/CHANGELOG_LATEST.md

      - name: Create GitHub Release (prerelease)
        if: env.IS_TAG == 'true' && steps.check-prerelease.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh release create "$TRIGGER_TAG" gds-data-linux-amd64 \
            --repo outsidee-Inc/gds-data \
            --title "$TRIGGER_TAG" \
            --notes "Pre-release version" \
            --prerelease

      - name: Notify failure (telegram)
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        shell: bash
        run: |
          TEXT="gds-data CI failed: test-build (tag release). $RUN_URL"
          curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.telegram.org/bot${ env.TELEGRAM_BOT_TOKEN }/sendMessage" \
            -F chat_id="${ env.TELEGRAM_CHAT_ID }" \
            -F text="$TEXT"

      - name: Set commit status (final)
        if: always() && env.TRIGGER_SHA != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Test and build succeeded"
          else
            STATE="failure"
            DESC="Test and build failed"
          fi
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$TRIGGER_SHA" \
            -f state="$STATE" -f context="ci/test-build" \
            -f description="$DESC" -f target_url="$RUN_URL"
