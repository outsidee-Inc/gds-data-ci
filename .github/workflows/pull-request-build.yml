name: Pull Request Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pull-request-build]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pr_number || github.event.client_payload.pr_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
  
jobs:
  Build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    outputs:
      linux-env-result: ${{ matrix.os == 'ubuntu-latest' && steps.set-basic-env-result-linux.outputs.result || 'skipped' }}
      windows-env-result: ${{ matrix.os == 'windows-latest' && steps.set-basic-env-result-windows.outputs.result || 'skipped' }}
      linux-build-result: ${{ steps.set-linux-result.outputs.result }}
      windows-build-result: ${{ steps.set-windows-result.outputs.result }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Mint CI bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.OUTSIDEE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OUTSIDEE_BOT_PRIVATE_KEY }}
          owner: outsidee-Inc
          repositories: gds-data

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: outsidee-Inc/gds-data
          token: ${{ steps.bot-token.outputs.token }}
          path: src
          # Do NOT leave the App token in src/.git/config: untrusted PR code
          # (cargo build/test) runs in this checkout and could read it.
          persist-credentials: false
          # Build the actual PR code, not the default branch
          ref: ${{ github.event.client_payload.pr_head_sha }}
        continue-on-error: true
      
      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable (master branch pin)
        # The action infers the toolchain from its ref (e.g. @stable); a raw SHA
        # pin removes that, so the input has to be given explicitly.
        with:
          toolchain: stable
        continue-on-error: true

      - name: Set Linux commit status (pending)
        if: matrix.os == 'ubuntu-latest' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$HEAD_SHA" \
            -f state="pending" -f context="ci/build/linux" \
            -f description="Linux build is running" -f target_url="$RUN_URL"

      - name: Set Windows commit status (pending)
        if: matrix.os == 'windows-latest' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$HEAD_SHA" \
            -f state="pending" -f context="ci/build/windows" \
            -f description="Windows build is running" -f target_url="$RUN_URL"

      - name: Set build env vars
        id: set-cache-env
        run: |
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          # Public repo logs are world-readable; debug-level logs leak internal
          # URLs/paths (e.g. the access-token endpoint). Keep it at info.
          echo "RUST_LOG=info" >> $GITHUB_ENV
          echo "DUCKDB_BUILD_CACHE=1" >> $GITHUB_ENV
        continue-on-error: true
        
      - name: Set basic environment result Linux
        id: set-basic-env-result-linux
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          CHECKOUT_STATUS="${{ steps.checkout.outcome }}"
          RUST_STATUS="${{ steps.install-rust.outcome }}"
          CACHE_ENV_STATUS="${{ steps.set-cache-env.outcome }}"
          
          echo "Checkout: $CHECKOUT_STATUS"
          echo "Install Rust: $RUST_STATUS"  
          echo "Set Cache Env: $CACHE_ENV_STATUS"
          
          if [ "$CHECKOUT_STATUS" = "success" ] && [ "$RUST_STATUS" = "success" ] && [ "$CACHE_ENV_STATUS" = "success" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "Basic environment setup completed successfully"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "Basic environment setup failed"
          fi

      - name: Set basic environment result Windows
        id: set-basic-env-result-windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $CHECKOUT_STATUS = "${{ steps.checkout.outcome }}"
          $RUST_STATUS = "${{ steps.install-rust.outcome }}"
          $CACHE_ENV_STATUS = "${{ steps.set-cache-env.outcome }}"
          
          Write-Host "Checkout: $CHECKOUT_STATUS"
          Write-Host "Install Rust: $RUST_STATUS"
          Write-Host "Set Cache Env: $CACHE_ENV_STATUS"
          
          if (($CHECKOUT_STATUS -eq "success") -and ($RUST_STATUS -eq "success") -and ($CACHE_ENV_STATUS -eq "success")) {
            "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Basic environment setup completed successfully"
          } else {
            "result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Basic environment setup failed"
          }
        
      # windows
      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        id: download-duckdb
        name: Download duckdb
        with:
          repository: "duckdb/duckdb"
          tag: "v1.3.2"
          fileName: libduckdb-windows-amd64.zip
          out-file-path: .
        continue-on-error: true

      - name: Windows extract duckdb
        id: extract-duckdb
        if: matrix.os == 'windows-latest'
        uses: DuckSoft/extract-7z-action@6eaaa506b410f047eaa9b22498696aad1e19a834 # v1.0
        with:
          pathSource: D:\a\gds-data-ci\gds-data-ci\libduckdb-windows-amd64.zip
          pathTarget: ${{ github.workspace }}/libduckdb
        continue-on-error: true

      - name: Add path to PATH environment variable
        id: add-path
        if: matrix.os == 'windows-latest'
        uses: myci-actions/export-env-var-powershell@92a2720a11021798d870de11095cf9e31422ea46 # 1
        with:
          name: PATH
          value: $env:PATH;${{ github.workspace }}/libduckdb
        continue-on-error: true

      - name: Build gds data on windows
        id: build-windows
        if: matrix.os == 'windows-latest' && steps.set-basic-env-result-windows.outputs.result == 'success'
        run: cargo build
        working-directory: src
        continue-on-error: true
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/libduckdb
          DUCKDB_INCLUDE_DIR: ${{ github.workspace }}/libduckdb
      
      - name: Set Windows build result
        id: set-windows-result
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $BASIC_ENV_RESULT = "${{ steps.set-basic-env-result-windows.outputs.result }}"
          $BUILD_RESULT = "${{ steps.build-windows.outcome }}"
          
          Write-Host "Basic Env Result: $BASIC_ENV_RESULT"
          Write-Host "Build Result: $BUILD_RESULT"
          
          if ($BASIC_ENV_RESULT -ne "success") {
            "result=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows build skipped due to basic environment failure"
          }
          elseif ($BUILD_RESULT -eq "success") {
            "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows build completed successfully"
          }
          elseif ($BUILD_RESULT -eq "failure") {
            "result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows build failed"
          }
          else {
            "result=unknown" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows build status unknown"
          }

      - name: Build gds data on linux
        id: build-linux
        if: matrix.os == 'ubuntu-latest' && steps.set-basic-env-result-linux.outputs.result == 'success'
        run: cargo build
        working-directory: src
        continue-on-error: true

      - name: Test gds data on linux
        id: test-linux
        if: matrix.os == 'ubuntu-latest' && steps.set-basic-env-result-linux.outputs.result == 'success'
        run: cargo test
        working-directory: src
        continue-on-error: true

      - name: Set Linux build result
        id: set-linux-result
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          BASIC_ENV_RESULT="${{ steps.set-basic-env-result-linux.outputs.result }}"
          BUILD_RESULT="${{ steps.build-linux.outcome }}"
          TEST_RESULT="${{ steps.test-linux.outcome }}"

          if [ "$BASIC_ENV_RESULT" != "success" ]; then
            echo "result=skipped" >> $GITHUB_OUTPUT
            echo "Linux build skipped due to basic environment failure"
          elif [ "$BUILD_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "Linux build and tests completed successfully"
          elif [ "$BUILD_RESULT" = "failure" ] || [ "$TEST_RESULT" = "failure" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "Linux build or tests failed"
          else
            echo "result=unknown" >> $GITHUB_OUTPUT
            echo "Linux build status unknown"
          fi

      - name: Set Linux commit status (final)
        if: always() && matrix.os == 'ubuntu-latest' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          RESULT="${{ steps.set-linux-result.outputs.result }}"
          case "$RESULT" in
            success) STATE="success"; DESC="Linux build succeeded" ;;
            failure) STATE="failure"; DESC="Linux build failed" ;;
            *)       STATE="failure"; DESC="Linux build skipped or unknown" ;;
          esac
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="ci/build/linux" \
            -f description="$DESC" -f target_url="$RUN_URL"

      - name: Set Windows commit status (final)
        if: always() && matrix.os == 'windows-latest' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          RESULT="${{ steps.set-windows-result.outputs.result }}"
          case "$RESULT" in
            success) STATE="success"; DESC="Windows build succeeded" ;;
            failure) STATE="failure"; DESC="Windows build failed" ;;
            *)       STATE="failure"; DESC="Windows build skipped or unknown" ;;
          esac
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="ci/build/windows" \
            -f description="$DESC" -f target_url="$RUN_URL"

      - name: Notify PR of leg failure
        if: failure() && github.event.client_payload.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          LEG: ${{ matrix.os }}
        run: |
          gh pr comment "${{ github.event.client_payload.pr_number }}" --repo outsidee-Inc/gds-data \
            --body "External CI: **$LEG** leg failed for commit \`${HEAD_SHA:0:7}\` - [run #${{ github.run_number }}]($RUN_URL)"

  Comment:
    needs: Build
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10

    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Mint CI bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.OUTSIDEE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OUTSIDEE_BOT_PRIVATE_KEY }}
          owner: outsidee-Inc
          repositories: gds-data

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: outsidee-Inc/gds-data
          token: ${{ steps.bot-token.outputs.token }}
          path: src

      - name: Extract failure log excerpt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > excerpt_raw.txt
          JOB_IDS=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("Build"))] | sort_by(.name != "Build (ubuntu-latest)") | .[].databaseId') || JOB_IDS=""
          for JOB_ID in $JOB_IDS; do
            gh run view --job "$JOB_ID" --log 2>/dev/null \
              | sed -E 's/\^\[\[[0-9;]*[mK]//g; s/\x1b\[[0-9;]*[mK]//g; s/^[^\t]*\t[^\t]*\t[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' \
              | grep -B 3 -A 17 -E 'error(\[E[0-9]+\])?:|panicked|^failures:|test result: FAILED' \
              >> excerpt_raw.txt || true
          done
          head -n 21 excerpt_raw.txt > failure-excerpt.txt
          if [ ! -s failure-excerpt.txt ]; then
            echo "(no error lines captured - see full log)" > failure-excerpt.txt
          fi

      - name: Comment PR with detailed results
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: outsidee-Inc/gds-data
        run: |
          HEAD_SHA="${{ github.event.client_payload.pr_head_sha }}"
          STATUSES=$(gh api "repos/outsidee-Inc/gds-data/commits/$HEAD_SHA/status" --jq '.statuses[] | "\(.context) \(.state)"')

          normalize() {
            case "$1" in
              success) echo "success" ;;
              failure | error) echo "failed" ;;
              pending) echo "running" ;;
              "") echo "skipped" ;;
              *) echo "unknown" ;;
            esac
          }

          LINUX=$(normalize "$(echo "$STATUSES" | awk '$1 == "ci/build/linux" {print $2}')")
          WINDOWS=$(normalize "$(echo "$STATUSES" | awk '$1 == "ci/build/windows" {print $2}')")

          if [ "$LINUX" = "success" ] && [ "$WINDOWS" = "success" ]; then
            VERDICT="Success"
          elif [ "$LINUX" = "success" ] || [ "$WINDOWS" = "success" ]; then
            VERDICT="Partial"
          else
            VERDICT="Failed"
          fi

          CI_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          FINISHED=$(date -u '+%Y-%m-%d %H:%M UTC')

          COMMENT_BODY="## External CI: $VERDICT

          Commit: \`$SHORT_SHA\`

          | Check | Result |
          | --- | --- |
          | Linux build + test | $LINUX |
          | Windows build | $WINDOWS |

          Log: [run #${{ github.run_number }}]($CI_URL)
          Finished: $FINISHED"

          if [ "$VERDICT" != "Success" ]; then
            COMMENT_BODY="$COMMENT_BODY

          <details><summary>Failure log excerpt (~20 lines around the first error)</summary>

          \`\`\`text
          $(cat failure-excerpt.txt)
          \`\`\`

          </details>

          A non-success row means that stage did not complete. Open the log link for the full output; skipped (environment setup failed) means checkout or toolchain setup failed before the build."
          fi

          echo "$COMMENT_BODY" | gh pr comment ${{ github.event.client_payload.pr_number }} --body-file -
