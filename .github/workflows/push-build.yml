name: Push Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [push-build]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: true

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TRIGGER_SHA: ${{ github.event.client_payload.sha }}

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Mint CI bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OUTSIDEE_BOT_APP_ID }}
          private-key: ${{ secrets.OUTSIDEE_BOT_PRIVATE_KEY }}
          owner: outsidee-Inc
          repositories: gds-data

      - name: Set commit status (pending)
        if: env.TRIGGER_SHA != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$TRIGGER_SHA" \
            -f state="pending" -f context="ci/push-build" \
            -f description="Push build is running" -f target_url="$RUN_URL"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: outsidee-Inc/gds-data
          token: ${{ steps.bot-token.outputs.token }}
          path: src
          ref: ${{ github.event.client_payload.sha || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set build env vars
        run: |
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "DUCKDB_BUILD_CACHE=1" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=$(nproc)" >> $GITHUB_ENV

      - name: Build
        run: cargo build --verbose
        working-directory: src
        env:
          RUST_BACKTRACE: 1

      - name: Test
        run: cargo test --verbose
        working-directory: src
        env:
          RUST_BACKTRACE: 1

      - name: Install dependencies
        run: |
          if ! command -v cargo-set-version >/dev/null 2>&1; then
            echo "Installing cargo-edit..."
            cargo install cargo-edit --locked
          fi
        working-directory: src

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        working-directory: src

      - name: Version update
        run: make bump-patch-with-sha
        working-directory: src

      - name: Git Operations
        run: |
          if git diff --quiet && git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
          fi

          git add .
          git commit -m "chore: update bin version [skip ci]"

          git pull --rebase --autostash origin main
          git push origin HEAD:main
        working-directory: src

      - name: Set commit status (final)
        if: always() && env.TRIGGER_SHA != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Push build and tests succeeded"
          else
            STATE="failure"
            DESC="Push build or tests failed"
          fi
          gh api -X POST "repos/outsidee-Inc/gds-data/statuses/$TRIGGER_SHA" \
            -f state="$STATE" -f context="ci/push-build" \
            -f description="$DESC" -f target_url="$RUN_URL"
