# ONE-TIME helper: copy this repo's repo-level secrets into the `prod`
# environment so that only jobs declaring `environment: prod` can read them.
# Secret values are never printed. Delete this file after a successful run.
name: Migrate Secrets To prod Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mint App token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.OUTSIDEE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OUTSIDEE_BOT_PRIVATE_KEY }}
          owner: outsidee-Inc
          repositories: gds-data-ci
          # Environment secrets are gated by the "Environments" permission,
          # not by "Secrets" (that one only covers repo-level secrets).
          permission-environments: write

      - name: Copy secrets into prod environment
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TARGET_REPO: outsidee-Inc/gds-data-ci
          SECRET_NAMES: "DEV_ACCESS_SECRET_ID DEV_ACCESS_TOKEN_URL DEV_DB_NAME DEV_MAIN_API_URL PROD_ACCESS_SECRET_ID PROD_ACCESS_TOKEN_URL PROD_DB_NAME PROD_MAIN_API_URL LOGFIRE_TOKEN RESEND_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID"
          DEV_ACCESS_SECRET_ID: ${{ secrets.DEV_ACCESS_SECRET_ID }}
          DEV_ACCESS_TOKEN_URL: ${{ secrets.DEV_ACCESS_TOKEN_URL }}
          DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DEV_MAIN_API_URL: ${{ secrets.DEV_MAIN_API_URL }}
          PROD_ACCESS_SECRET_ID: ${{ secrets.PROD_ACCESS_SECRET_ID }}
          PROD_ACCESS_TOKEN_URL: ${{ secrets.PROD_ACCESS_TOKEN_URL }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_MAIN_API_URL: ${{ secrets.PROD_MAIN_API_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAIL=0
          for NAME in $SECRET_NAMES; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::error::$NAME is empty in the source (repo-level) secrets"
              FAIL=1
              continue
            fi
            if printf '%s' "$VALUE" | gh secret set "$NAME" --env prod --repo "$TARGET_REPO"; then
              echo "migrated: $NAME"
            else
              echo "::error::failed to migrate $NAME"
              FAIL=1
            fi
          done
          exit "$FAIL"

      - name: Verify target environment secrets
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api "repos/outsidee-Inc/gds-data-ci/environments/prod/secrets" --jq '.secrets[].name' | sort
